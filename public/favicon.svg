<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE195"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7A1E"/>
      <stop offset="100%" stop-color="#F5D77F"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA7A1E"/>
      <stop offset="50%" stop-color="#FCE195"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Medallion -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="url(#goldBorder)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="1.5 1"/>

  <!-- Left Ring -->
  <circle cx="26" cy="34" r="12" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#goldGlow)"/>

  <!-- Right Ring (Interlocking) -->
  <circle cx="38" cy="34" r="12" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#goldGlow)"/>

  <!-- Interlocking overlap bridge -->
  <path d="M 33 22.5 A 12 12 0 0 1 38 22 A 12 12 0 0 1 43.5 24" fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>

  <!-- Diamond Sparkle Glint -->
  <g transform="translate(41, 23)">
    <!-- 4-point star -->
    <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7 Z" fill="#FFFFFF"/>
    <!-- Diagonal smaller glints -->
    <path d="M 0 -4.5 Q 0 0 4.5 0 Q 0 0 0 4.5 Q 0 0 -4.5 0 Q 0 0 0 -4.5 Z" fill="#FFF9DE" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
